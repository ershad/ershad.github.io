<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: "en" }}">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Set the theme before first paint. White is the default; the OS preference is
      // deliberately not consulted, only an explicit choice made with the toggle.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        // Marks JS as available: the mobile nav starts collapsed only then, so a
        // no-JS visitor keeps a plain, always-visible list of links.
        document.documentElement.setAttribute('data-nav', 'closed');
      })();
    </script>
    <link rel="icon" href="{{ '/favicon.ico' | absolute_url }}">
    <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | absolute_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
      :root {
        --paper: #FBF9F5;
        --paper-sunk: #F3EFE7;
        --ink: #17150F;
        --ink-2: #4C463C;
        --ink-3: #8B8275;
        --rule: #E4DDD0;
        --rule-soft: #EFEAE0;
        --accent: #A6431C;
        --accent-wash: rgba(166, 67, 28, 0.09);
        --serif: 'Newsreader', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
        --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --measure: 50rem;
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        --paper: #100F0D;
        --paper-sunk: #191713;
        --ink: #EFEBE3;
        --ink-2: #B4ABA0;
        --ink-3: #837A6E;
        --rule: #2B2823;
        --rule-soft: #221F1B;
        --accent: #E28D62;
        --accent-wash: rgba(226, 141, 98, 0.11);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink-2);
        font-family: var(--sans);
        font-size: 16.5px;
        line-height: 1.7;
        font-feature-settings: "kern" 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection { background: var(--accent); color: var(--paper); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

      a { color: var(--ink); text-decoration: none; }
      p a, li a {
        color: var(--ink);
        border-bottom: 1px solid var(--rule);
        transition: border-color .18s ease, color .18s ease;
      }
      p a:hover, li a:hover { color: var(--accent); border-bottom-color: var(--accent); }

      .shell {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 5vw, 2.5rem);
      }

      /* ---------- masthead ---------- */
      .masthead {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        flex-wrap: wrap;
        padding: 1.75rem 0 1.5rem;
      }
      .monogram {
        font-family: var(--serif);
        font-size: 1.0625rem;
        letter-spacing: .02em;
        color: var(--ink);
      }
      .monogram span { color: var(--ink-3); }
      .masthead nav {
        display: flex;
        gap: clamp(.9rem, 2.4vw, 1.6rem);
        flex-wrap: wrap;
        margin-left: auto;
        font-family: var(--mono);
        font-size: .75rem;
        letter-spacing: .04em;
      }
      .masthead nav a { color: var(--ink-3); transition: color .18s ease; }
      .masthead nav a:hover { color: var(--accent); }
      .masthead__buttons {
        display: flex;
        align-items: center;
        gap: .5rem;
        flex: 0 0 auto;
      }
      .icon-btn {
        appearance: none;
        -webkit-appearance: none;
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--rule);
        border-radius: 999px;
        color: var(--ink-3);
        cursor: pointer;
        transition: color .18s ease, border-color .18s ease, background .18s ease;
      }
      .icon-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
      .icon-btn svg { width: 14px; height: 14px; display: block; }
      /* Icons follow state in CSS, so they are right on the first paint. */
      .theme-toggle .icon-sun { display: none; }
      :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
      :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
      .nav-toggle { display: none; }
      .nav-toggle .icon-close { display: none; }
      :root[data-nav="open"] .nav-toggle .icon-burger { display: none; }
      :root[data-nav="open"] .nav-toggle .icon-close { display: block; }

      /* ---------- intro ---------- */
      .intro {
        display: flex;
        align-items: center;
        gap: clamp(1.25rem, 4vw, 2.25rem);
        padding: clamp(2.25rem, 6vw, 3.75rem) 0 2rem;
      }
      .portrait {
        flex: 0 0 auto;
        width: clamp(78px, 13vw, 104px);
        height: clamp(78px, 13vw, 104px);
        border-radius: 50%;
        object-fit: cover;
        background: var(--paper-sunk);
        box-shadow: 0 0 0 1px var(--rule), 0 0 0 6px var(--accent-wash);
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.9rem, 6.4vw, 3.15rem);
        line-height: 1.05;
        letter-spacing: -.018em;
        color: var(--ink);
        margin: 0;
      }

      /* ---------- lede ---------- */
      .lede { padding-bottom: 2.5rem; }
      .lede p {
        font-family: var(--serif);
        font-size: clamp(1.14rem, 2.4vw, 1.33rem);
        line-height: 1.6;
        color: var(--ink);
        margin: 0 0 1rem;
        max-width: 62ch;
      }
      .lede p:last-child { margin-bottom: 0; }
      .lede em { font-style: italic; }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: .6rem;
        padding-bottom: .5rem;
      }
      .btn {
        font-family: var(--mono);
        font-size: .76rem;
        letter-spacing: .03em;
        padding: .5rem .95rem;
        border: 1px solid var(--rule);
        border-radius: 999px;
        color: var(--ink-2);
        transition: border-color .18s ease, color .18s ease, background .18s ease;
      }
      .btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }

      /* ---------- rows ---------- */
      .row {
        display: grid;
        grid-template-columns: 8rem 1fr;
        gap: 0 2.5rem;
        padding: 2.6rem 0;
        border-top: 1px solid var(--rule);
      }
      .row__label {
        font-family: var(--mono);
        font-size: .7rem;
        font-weight: 500;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: .3rem 0 0;
      }
      .row__body > :first-child { margin-top: 0; }
      .row__body > :last-child { margin-bottom: 0; }
      .row__body p { margin: 0 0 1rem; }

      /* ---------- work ---------- */
      .job {
        display: grid;
        grid-template-columns: 6.25rem 1fr;
        gap: 0 1.5rem;
        padding: 0 0 1.6rem;
      }
      .job:last-child { padding-bottom: 0; }
      .job__years {
        font-family: var(--mono);
        font-size: .74rem;
        letter-spacing: .01em;
        color: var(--ink-3);
        padding-top: .3rem;
        font-variant-numeric: tabular-nums;
      }
      .job__org {
        font-family: var(--serif);
        font-size: 1.2rem;
        font-weight: 500;
        line-height: 1.3;
        color: var(--ink);
        margin: 0;
      }
      .job__roles {
        font-size: .875rem;
        color: var(--ink-3);
        margin: .1rem 0 .3rem !important;
      }
      .job__note { font-size: .94rem; margin: 0 !important; }

      /* ---------- stacks ---------- */
      .stack { margin: 0 0 1.35rem; }
      .stack:last-child { margin-bottom: 0; }
      .stack__name {
        font-family: var(--serif);
        font-size: 1.08rem;
        font-weight: 500;
        color: var(--ink);
        margin: 0 0 .15rem;
      }
      .stack__items {
        font-family: var(--mono);
        font-size: .78rem;
        line-height: 1.85;
        color: var(--ink-3);
        letter-spacing: .005em;
      }

      /* ---------- lists ---------- */
      .plain { list-style: none; margin: 0; padding: 0; }
      .plain > li { padding: 0 0 .95rem; font-size: .96rem; }
      .plain > li:last-child { padding-bottom: 0; }
      .plain strong { color: var(--ink); font-weight: 500; }

      .elsewhere { list-style: none; margin: 0; padding: 0; }
      .elsewhere > li {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: 1.25rem;
        padding: .38rem 0;
        align-items: baseline;
      }
      .elsewhere .k {
        font-family: var(--mono);
        font-size: .72rem;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .elsewhere a { border-bottom: 1px solid var(--rule); justify-self: start; }
      .elsewhere a:hover { color: var(--accent); border-bottom-color: var(--accent); }

      /* ---------- interior pages ---------- */
      .masthead nav a[aria-current="page"] { color: var(--ink); }

      .page-head { padding: clamp(2rem, 5.5vw, 3.5rem) 0 1.75rem; }
      .page-title {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(1.95rem, 5.4vw, 2.7rem);
        line-height: 1.08;
        letter-spacing: -.016em;
        color: var(--ink);
        margin: 0 0 .65rem;
      }
      .page-lede {
        font-family: var(--serif);
        font-size: clamp(1.06rem, 2.1vw, 1.2rem);
        line-height: 1.6;
        color: var(--ink);
        margin: 0;
        max-width: 58ch;
      }

      /* a dated entry: mono date column, description beside it */
      .entry {
        display: grid;
        grid-template-columns: 10rem 1fr;
        gap: 0 1.5rem;
        padding: 0 0 1.15rem;
      }
      .entry:last-child { padding-bottom: 0; }
      .entry__date {
        font-family: var(--mono);
        font-size: .74rem;
        line-height: 1.75;
        letter-spacing: .01em;
        color: var(--ink-3);
        padding-top: .18rem;
        font-variant-numeric: tabular-nums;
      }
      .entry__what {
        font-family: var(--serif);
        font-size: 1.08rem;
        line-height: 1.45;
        color: var(--ink);
        margin: 0;
      }
      .entry__where { font-size: .9rem; color: var(--ink-3); margin: .12rem 0 0; }
      .entry__where a { color: var(--ink-3); border-bottom: 1px solid var(--rule); }
      .entry__where a:hover { color: var(--accent); border-bottom-color: var(--accent); }

      /* ---------- footer ---------- */
      .foot {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 1rem;
        flex-wrap: wrap;
        border-top: 1px solid var(--rule);
        padding: 1.75rem 0 3rem;
        font-family: var(--mono);
        font-size: .72rem;
        letter-spacing: .03em;
        color: var(--ink-3);
      }
      .foot a { color: var(--ink-3); }
      .foot a:hover { color: var(--accent); }

      /* ---------- night sky (dark only) ---------- */
      /* A faint starfield with the occasional meteor. Painted on a fixed canvas
         that only fades in for the dark theme; .shell sits above it. */
      #night-sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      :root[data-theme="dark"] #night-sky { opacity: 1; }
      .shell { position: relative; z-index: 1; }
      @media (prefers-reduced-motion: reduce) {
        :root[data-theme="dark"] #night-sky { opacity: 0; }
      }

      /* ---------- responsive ---------- */
      @media (max-width: 36rem) {
        .nav-toggle { display: inline-flex; }
        .icon-btn { width: 38px; height: 38px; }
        .icon-btn svg { width: 16px; height: 16px; }
        .masthead { gap: .75rem 1rem; padding-bottom: 1.1rem; }
        .masthead__buttons { margin-left: auto; gap: .55rem; }
        .masthead nav {
          order: 3;
          flex-basis: 100%;
          margin-left: 0;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          font-size: .82rem;
          border-top: 1px solid var(--rule);
          margin-top: .35rem;
        }
        .masthead nav a {
          padding: .72rem .1rem;
          border-bottom: 1px solid var(--rule-soft);
        }
        .masthead nav a:last-child { border-bottom: 0; }
        /* Collapsed only when JS set data-nav; otherwise the list stays visible. */
        :root[data-nav] .masthead nav { display: none; }
        :root[data-nav="open"] .masthead nav { display: flex; }
      }

      @media (max-width: 44rem) {
        .row { grid-template-columns: 1fr; gap: .85rem 0; padding: 2.1rem 0; }
        .row__label { margin: 0; }
        .job { grid-template-columns: 1fr; gap: .1rem; }
        .job__years { padding-top: 0; }
        .entry { grid-template-columns: 1fr; gap: .15rem; padding-bottom: 1.35rem; }
        .entry__date { padding-top: 0; }
        .elsewhere > li { grid-template-columns: 4.5rem 1fr; gap: .9rem; }
      }
      @media (max-width: 30rem) {
        .intro { flex-direction: column; align-items: flex-start; gap: 1.1rem; }
      }

      @media print {
        :root { --paper: #fff; --ink: #000; --ink-2: #222; --ink-3: #555; --rule: #ccc; --accent: #000; }
        .masthead nav, .masthead__buttons, .actions, .foot, #night-sky { display: none; }
        .row { break-inside: avoid; page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <canvas id="night-sky" aria-hidden="true"></canvas>
    {{ content }}
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function sync() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        }
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          sync();
        });
        sync();
      })();
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById('nav-toggle');
        if (!btn) return;
        function set(open) {
          root.setAttribute('data-nav', open ? 'open' : 'closed');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        }
        btn.addEventListener('click', function () {
          set(root.getAttribute('data-nav') !== 'open');
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && root.getAttribute('data-nav') === 'open') {
            set(false);
            btn.focus();
          }
        });
        set(false);
      })();
    </script>
    <script>
      // Night sky: a starfield drifting outward from a vanishing point, as if the
      // page were moving slowly forward, with a meteor crossing now and then.
      // Dark theme only, and never for visitors who ask for reduced motion.
      (function () {
        var canvas = document.getElementById('night-sky');
        if (!canvas || !canvas.getContext) return;

        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
        if (reduce && reduce.matches) return;

        var root = document.documentElement;
        var ctx = canvas.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = 0, h = 0, cx = 0, cy = 0, edge = 0;
        var stars = [];
        var meteors = [];
        var nextMeteor = 0;
        var raf = null;
        var last = 0;
        var clock = 0;

        // Perspective drift: a star's speed is proportional to how far it already
        // is from the vanishing point, which is what forward motion actually
        // looks like. Small rate, so the whole field only creeps.
        var DRIFT = 0.017;

        function rand(min, max) { return min + Math.random() * (max - min); }

        function placeStar(st, dist) {
          st.angle = rand(0, Math.PI * 2);
          st.dist = dist;
          st.depth = rand(0.55, 1.45);
          st.base = rand(0.10, 0.38);
          st.twinkle = rand(0.06, 0.24);
          st.phase = rand(0, Math.PI * 2);
          // A warm tint on some, cool on others, so it doesn't read as flat grey.
          st.warm = Math.random() < 0.35;
          return st;
        }

        function seedStars() {
          // Density rather than a fixed count, so a wide screen isn't left bare.
          var n = Math.round((w * h) / 9500);
          n = Math.max(45, Math.min(n, 210));
          stars = [];
          for (var i = 0; i < n; i++) {
            // Seeded across the whole field, not all bunched at the centre.
            stars.push(placeStar({}, rand(6, edge)));
          }
        }

        function spawnMeteor() {
          // Falls left-to-right or right-to-left, always downward and shallow.
          var toLeft = Math.random() < 0.5;
          var angle = (toLeft ? Math.PI - 0.42 : 0.42) + rand(-0.12, 0.12);
          meteors.push({
            x: toLeft ? rand(w * 0.45, w * 1.05) : rand(-w * 0.05, w * 0.55),
            y: rand(-h * 0.05, h * 0.45),
            angle: angle,
            speed: rand(520, 820),
            len: rand(90, 190),
            life: 0,
            span: rand(0.85, 1.35),
            peak: rand(0.28, 0.52)
          });
        }

        function scheduleMeteor() { nextMeteor = clock + rand(3, 8); }

        function resize() {
          w = window.innerWidth;
          h = window.innerHeight;
          cx = w / 2;
          cy = h / 2;
          edge = Math.sqrt(cx * cx + cy * cy);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          seedStars();
        }

        function drawStars(dt) {
          for (var i = 0; i < stars.length; i++) {
            var st = stars[i];
            // Exponential growth away from the centre: the further out a star is,
            // the faster it sweeps past — the whole field moves as one.
            st.dist *= 1 + DRIFT * st.depth * dt;
            if (st.dist > edge + 30) placeStar(st, rand(2, 10));

            var x = cx + Math.cos(st.angle) * st.dist;
            var y = cy + Math.sin(st.angle) * st.dist;

            var t = Math.sin(clock * Math.PI * 2 * st.twinkle + st.phase) * 0.5 + 0.5;
            // Fade in over the first stretch so recycled stars never pop into view.
            var born = Math.min(1, st.dist / 90);
            var alpha = st.base * (0.5 + 0.5 * t) * born;

            ctx.globalAlpha = alpha;
            ctx.fillStyle = st.warm ? 'rgb(247, 219, 190)' : 'rgb(226, 231, 240)';
            ctx.beginPath();
            // Nearer stars (further out) read slightly larger.
            ctx.arc(x, y, 0.45 + 0.85 * (st.dist / edge), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function drawMeteor(m) {
          // Ease in fast, linger, then fade out — no popping at either end.
          var p = m.life / m.span;
          var fade = p < 0.15 ? p / 0.15 : (1 - p) / 0.85;
          var alpha = m.peak * Math.max(0, Math.min(1, fade));
          if (alpha <= 0) return;

          var tx = m.x - Math.cos(m.angle) * m.len;
          var ty = m.y - Math.sin(m.angle) * m.len;
          var grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
          grad.addColorStop(0, 'rgba(255, 244, 226, ' + alpha + ')');
          grad.addColorStop(0.35, 'rgba(238, 205, 172, ' + (alpha * 0.35) + ')');
          grad.addColorStop(1, 'rgba(226, 141, 98, 0)');

          ctx.globalAlpha = 1;
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.25;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tx, ty);
          ctx.stroke();

          // A slightly brighter head so the streak has a leading point.
          ctx.globalAlpha = alpha;
          ctx.fillStyle = 'rgb(255, 248, 236)';
          ctx.beginPath();
          ctx.arc(m.x, m.y, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }

        function step(now) {
          var dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          clock += dt;

          ctx.clearRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'lighter';

          drawStars(dt);

          for (var i = meteors.length - 1; i >= 0; i--) {
            var m = meteors[i];
            m.life += dt;
            m.x += Math.cos(m.angle) * m.speed * dt;
            m.y += Math.sin(m.angle) * m.speed * dt;
            if (m.life > m.span || m.y - m.len > h || m.x < -m.len || m.x > w + m.len) meteors.splice(i, 1);
            else drawMeteor(m);
          }
          // A couple can overlap, but never a shower.
          if (clock >= nextMeteor && meteors.length < 2) {
            spawnMeteor();
            scheduleMeteor();
          }

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          raf = window.requestAnimationFrame(step);
        }

        function start() {
          if (raf !== null) return;
          if (!stars.length) {
            resize();
            scheduleMeteor();
          }
          last = window.performance ? window.performance.now() : Date.now();
          raf = window.requestAnimationFrame(step);
        }

        function stop() {
          if (raf === null) return;
          window.cancelAnimationFrame(raf);
          raf = null;
          ctx.clearRect(0, 0, w, h);
        }

        // rAF is already parked while the tab is in the background, and dt is
        // clamped above, so there is nothing extra to do for visibility.
        function sync() {
          if (root.getAttribute('data-theme') === 'dark') start();
          else stop();
        }

        window.addEventListener('resize', function () { if (raf !== null) resize(); });
        // The theme toggle flips data-theme on <html>; follow it either way.
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
        sync();
      })();
    </script>
